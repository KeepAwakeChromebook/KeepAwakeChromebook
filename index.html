<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Portal & System Control</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      color: #58a6ff;
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: #8b949e;
      font-size: 0.95rem;
    }

    .card {
      width: 100%;
      max-width: 600px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    /* Subject Selection */
    .subject-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 10px;
      margin-top: 1rem;
    }

    .subject-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #f0f6fc;
      padding: 0.75rem 0.5rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .subject-btn:hover {
      background: #30363d;
      border-color: #58a6ff;
    }

    /* Question Box */
    .question-box {
      display: none;
      margin-top: 1.5rem;
      background: #0d1117;
      padding: 1rem;
      border-radius: 6px;
      border: 1px solid #30363d;
    }

    .question-text {
      font-weight: 600;
      margin-bottom: 1rem;
      color: #f0f6fc;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .option-label {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #161b22;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #30363d;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .option-label:hover {
      background: #21262d;
    }

    .option-label input {
      accent-color: #1f6beb;
    }

    .action-btn {
      margin-top: 1rem;
      background: #238636;
      color: #fff;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    .action-btn:hover {
      background: #2ea043;
    }

    .error-msg {
      color: #f85149;
      margin-top: 0.5rem;
      font-weight: bold;
      display: none;
    }

    /* System Dashboard (Unlocked Area) */
    #dashboard {
      display: none;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-left: 8px;
    }

    .status-off { background: #30363d; color: #8b949e; }
    .status-on { background: #238636; color: #7ee787; }

    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 0;
      border-bottom: 1px solid #21262d;
    }

    .control-row:last-child {
      border-bottom: none;
    }

    .toggle-btn {
      background: #1f6beb;
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    .toggle-btn.active {
      background: #da3633;
    }

    .align-grid {
      display: flex;
      gap: 10px;
      margin-top: 0.5rem;
    }

    .align-btn {
      flex: 1;
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 0.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .align-btn.selected {
      border-color: #58a6ff;
      color: #58a6ff;
      background: #161b22;
    }
  </style>
</head>
<body>

  <header>
    <h1>Access Control Portal</h1>
    <p class="subtitle">Answer one verification question to unlock system tools.</p>
  </header>

  <!-- Verification Card -->
  <div class="card" id="quiz-card">
    <h3>Select Subject</h3>
    <div class="subject-grid">
      <button class="subject-btn" onclick="selectSubject('electives')">Electives</button>
      <button class="subject-btn" onclick="selectSubject('math')">Math</button>
      <button class="subject-btn" onclick="selectSubject('science')">Science</button>
      <button class="subject-btn" onclick="selectSubject('ela')">ELA</button>
      <button class="subject-btn" onclick="selectSubject('civics')">Civics</button>
    </div>

    <div class="question-box" id="question-box">
      <div class="question-text" id="question-text"></div>
      <div class="options-list" id="options-list"></div>
      <button class="action-btn" onclick="verifyAnswer()">Verify Access</button>
      <div class="error-msg" id="error-msg">Incorrect answer. Try another question!</div>
    </div>
  </div>

  <!-- Unlocked System Dashboard -->
  <div class="card" id="dashboard">
    <h3 style="color: #56d364; margin-bottom: 1rem;">System Unlocked</h3>

    <!-- Keep Awake Tool -->
    <div class="control-row">
      <div>
        <strong>Keep Awake Engine</strong>
        <span class="status-badge status-off" id="awake-status">OFF</span>
        <div style="font-size: 0.8rem; color: #8b949e; margin-top: 2px;">Prevents screen dimming & sleep mode</div>
      </div>
      <button class="toggle-btn" id="awake-btn" onclick="toggleKeepAwake()">Enable</button>
    </div>

    <!-- Layout & Alignment Controls -->
    <div style="margin-top: 1.5rem;">
      <strong>Dashboard Alignment</strong>
      <div style="font-size: 0.8rem; color: #8b949e; margin-bottom: 0.5rem;">Arrange workspace elements</div>
      <div class="align-grid">
        <button class="align-btn selected" onclick="setAlignment('center', this)">Centered</button>
        <button class="align-btn" onclick="setAlignment('flex-start', this)">Left Align</button>
        <button class="align-btn" onclick="setAlignment('flex-end', this)">Right Align</button>
      </div>
    </div>
  </div>

  <script>
    const questionBank = {
      electives: [
        { q: "In digital art, what key shortcut is used to 'Undo'?", opts: ["Ctrl + Z", "Ctrl + C", "Ctrl + P"], ans: 0 },
        { q: "In music, what does BPM stand for?", opts: ["Beats Per Minute", "Bass Per Measure", "Bits Per Mark"], ans: 0 },
        { q: "Which tool is commonly used for simple 3D design online?", opts: ["Tinkercad", "Excel", "Word"], ans: 0 }
      ],
      math: [
        { q: "What is 12 × 8?", opts: ["84", "96", "104"], ans: 1 },
        { q: "What is the square root of 81?", opts: ["7", "8", "9"], ans: 2 },
        { q: "What is 144 ÷ 12?", opts: ["10", "12", "14"], ans: 1 }
      ],
      science: [
        { q: "What planet is known as the Red Planet?", opts: ["Venus", "Mars", "Jupiter"], ans: 1 },
        { q: "What chemical symbol represents water?", opts: ["CO2", "H2O", "NaCl"], ans: 1 },
        { q: "What force pulls objects toward Earth?", opts: ["Friction", "Gravity", "Magnetism"], ans: 1 }
      ],
      ela: [
        { q: "Which word is a noun in: 'The quick dog ran'?", opts: ["Quick", "Dog", "Ran"], ans: 1 },
        { q: "What punctuation ends a question?", opts: ["Period", "Question mark", "Exclamation mark"], ans: 1 },
        { q: "What figure of speech uses 'like' or 'as'?", opts: ["Metaphor", "Simile", "Hyperbole"], ans: 1 }
      ],
      civics: [
        { q: "Who was the first President of the United States?", opts: ["George Washington", "Thomas Jefferson", "Abraham Lincoln"], ans: 0 },
        { q: "How many branches are in the U.S. government?", opts: ["2", "3", "4"], ans: 1 },
        { q: "How long is one term for a U.S. President?", opts: ["2 years", "4 years", "6 years"], ans: 1 }
      ]
    };

    let currentQuestion = null;
    let wakeLock = null;

    function selectSubject(subjectKey) {
      const pool = questionBank[subjectKey];
      currentQuestion = pool[Math.floor(Math.random() * pool.length)];

      document.getElementById('error-msg').style.display = 'none';
      document.getElementById('question-box').style.display = 'block';
      document.getElementById('question-text').innerText = currentQuestion.q;

      const optsContainer = document.getElementById('options-list');
      optsContainer.innerHTML = '';

      currentQuestion.opts.forEach((opt, idx) => {
        optsContainer.innerHTML += `
          <label class="option-label">
            <input type="radio" name="quiz-opt" value="${idx}">
            ${opt}
          </label>
        `;
      });
    }

    function verifyAnswer() {
      const selected = document.querySelector('input[name="quiz-opt"]:checked');
      if (selected && parseInt(selected.value) === currentQuestion.ans) {
        // Correct Answer -> Unlock Dashboard
        document.getElementById('quiz-card').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
      } else {
        // Incorrect Answer
        document.getElementById('error-msg').style.display = 'block';
      }
    }

    async function toggleKeepAwake() {
      const btn = document.getElementById('awake-btn');
      const status = document.getElementById('awake-status');

      if (!wakeLock) {
        try {
          if ('wakeLock' in navigator) {
            wakeLock = await navigator.wakeLock.request('screen');
            status.innerText = 'ACTIVE';
            status.className = 'status-badge status-on';
            btn.innerText = 'Disable';
            btn.classList.add('active');
          } else {
            alert('Screen Wake Lock API is not supported in this browser.');
          }
        } catch (err) {
          console.error(err);
        }
      } else {
        wakeLock.release().then(() => {
          wakeLock = null;
          status.innerText = 'OFF';
          status.className = 'status-badge status-off';
          btn.innerText = 'Enable';
          btn.classList.remove('active');
        });
      }
    }

    function setAlignment(position, btn) {
      document.body.style.alignItems = position;
      document.querySelectorAll('.align-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }
  </script>

</body>
</html>
